name: 安卓模拟器整机测试 v2.2
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/emulator-test.yml']

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 启用KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 下载 v2.2 APK
        run: |
          for i in 1 2 3 4 5; do
            gh release download v2.2-offline -R "$GITHUB_REPOSITORY" -p '*.apk' -O /tmp/app.apk && break
            echo "retry $i"; sleep 10
          done
          ls -la /tmp/app.apk
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 安装 Android 工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "platform-tools" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n test -k "system-images;android-30;google_apis;x86_64" -d pixel_4
          ls -la "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: 启动模拟器
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -accel on > /tmp/emu.log 2>&1 &
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done; echo BOOTED'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0

      - name: 安装并启动游戏 (联网模式)
        run: |
          adb install -r /tmp/app.apk
          adb shell monkey -p com.jiguang.dldl.sy37 -c android.intent.category.LAUNCHER 1
          sleep 8
          # 首启隐私协议: 点"同意" (pixel_4 1080x2280, x=73% y=87.5%)
          adb shell input tap 788 1995
          sleep 2
          adb shell input tap 788 1995

      - name: 联网模式截图序列
        run: |
          mkdir -p shots
          for i in $(seq 1 18); do
            sleep 10
            adb exec-out screencap -p > shots/on_$(printf %02d $i).png
            echo "--- 联网 第${i}0秒 ---"
          done

      - name: 断网测试 (飞行模式, 验证真离线)
        run: |
          adb shell cmd connectivity airplane-mode enable
          sleep 3
          adb shell am force-stop com.jiguang.dldl.sy37
          sleep 2
          adb shell monkey -p com.jiguang.dldl.sy37 -c android.intent.category.LAUNCHER 1
          for i in $(seq 1 15); do
            sleep 10
            adb exec-out screencap -p > shots/off_$(printf %02d $i).png
            echo "--- 离线 第${i}0秒 ---"
          done

      - name: 抓取logcat
        if: always()
        run: |
          adb logcat -d > shots/logcat.txt 2>/dev/null || true
          grep -iE "offline|vserver|error|exception" shots/logcat.txt | tail -100 > shots/logcat_key.txt || true

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: emulator-shots
          path: shots/
