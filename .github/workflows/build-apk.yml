name: 构建离线APK v2.3
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['game/**', 'scripts/patch_offline.py', 'scripts/patch_dex_gate.py', 'keystore/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载基础APK (v2.0)
        run: |
          gh release download v2.0-offline -R "$GITHUB_REPOSITORY" -p '*.apk' -O base.apk
          ls -la base.apk
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android 构建工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: 下载 smali 工具 (baksmali/smali 2.5.2 fat jar)
        run: |
          curl -sSL -o baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          curl -sSL -o smali.jar https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar
          java -jar baksmali.jar --version && java -jar smali.jar --version

      - name: SDK门禁补丁 (绕过37wan启动门禁 网络检查/隐私弹窗/热更)
        run: |
          python3 scripts/patch_dex_gate.py base.apk baksmali.jar smali.jar

      - name: 下载版本链文件 (CDN, scrc32字节校验)
        run: |
          mkdir -p vendor
          python3 - << 'EOF'
          import json, os, urllib.request, sys
          sys.path.insert(0, 'scripts')
          from patch_offline import scrc32
          spec = json.load(open('game/vendor.json'))
          base = spec['base']
          ok = True
          for f in spec['files']:
              path, size, want = f['path'], f['size'], f['scrc32']
              dest = os.path.join('vendor', path)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              urllib.request.urlretrieve(base + path, dest)
              data = open(dest, 'rb').read()
              got = format(scrc32(data), '08x')
              status = 'OK' if (got == want and len(data) == size) else 'FAIL'
              if status == 'FAIL': ok = False
              print('%s %-42s %d/%dB %s' % (status, path, len(data), size, got))
          if not ok:
              print('!! 版本链字节校验失败'); sys.exit(1)
          print('版本链校验全部通过')
          EOF

      - name: 应用离线补丁 (DCC重打+filetable+入口替换+禁用CDN更新)
        run: |
          python3 scripts/patch_offline.py base.apk game/ vendor/ patched.apk

      - name: 对齐并签名
        run: |
          zipalign -f -p 4 patched.apk aligned.apk
          apksigner sign --ks keystore/dldl.jks --ks-pass pass:dldl123456 \
            --key-pass pass:dldl123456 --out dldlh5_offline_v2.3.apk aligned.apk
          apksigner verify --print-certs dldlh5_offline_v2.3.apk | head -5
          ls -la dldlh5_offline_v2.3.apk

      - name: 上传为 v2.3 Release (幂等)
        run: |
          if gh release view v2.3-offline -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release 已存在, 上传新资产"
            gh release upload v2.3-offline dldlh5_offline_v2.3.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create v2.3-offline dldlh5_offline_v2.3.apk \
              --title "单机离线版 v2.3 (免登录·免网络·开箱即玩)" \
              --notes "三重门禁全部解除, 打开即进游戏:

          - 绕过 37wan SDK 启动门禁 (smali补丁): 跳过网络检查/隐私协议弹窗/SDK登录
          - 屏蔽 SDK 热更杀进程 (在线100秒被杀问题修复)
          - 离线 (飞行模式) 也能正常进入游戏
          - 免登录: index 直启游戏, 本地虚拟服务器承担全部服务器功能
          - 永离线: DCC filetable 重打 (scrc32 校验全对齐), 禁用 CDN 更新
          - VIP 默认3级 | GM画布菜单(真机可见) | 猎场协议 | 假人聊天
          - 剧情: 主城出生→老杰克→大师→武魂觉醒五选一→先天满魂力 (手动点击推进)
          - versionCode 1023 (可直接覆盖安装)" \
              -R "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 上传构建产物 (备用)
        uses: actions/upload-artifact@v4
        with:
          name: dldlh5-offline-v23-apk
          path: dldlh5_offline_v2.3.apk
